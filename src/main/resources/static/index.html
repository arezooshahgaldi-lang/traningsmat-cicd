<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Träningsmat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🥗 Träningsmat</h1>
    <p>Recept sorterade efter träningsmål</p>
</header>

<main>
    <section class="form-section">
        <h2>Lägg till nytt recept</h2>

        <form id="recipe-form">
            <label for="title">Titel</label>
            <input type="text" id="title" name="title" required>

            <label for="description">Beskrivning</label>
            <input type="text" id="description" name="description" required>

            <label for="category">Kategori</label>
            <select id="category" name="category" required>
                <option value="STYRKA">Styrka</option>
                <option value="ATERHAMTNING">Återhämtning</option>
                <option value="VIKTNEDGANG">Viktnedgång</option>
                <option value="UTHALLIGHET">Uthållighet</option>
            </select>

            <label for="calories">Kalorier (kcal)</label>
            <input type="number" id="calories" name="calories" min="0" required>

            <label for="proteinGrams">Protein (g)</label>
            <input type="number" id="proteinGrams" name="proteinGrams" min="0" required>

            <label for="difficulty">Svårighetsgrad</label>
            <select id="difficulty" name="difficulty" required>
                <option value="LATT">Lätt</option>
                <option value="MEDEL">Medel</option>
                <option value="SVAR">Svår</option>
            </select>

            <button type="submit">Spara recept</button>
        </form>

        <p id="form-error" class="error-message"></p>
    </section>

    <section class="list-section">
        <h2>Alla recept</h2>
        <div id="recipe-list" class="recipe-list"></div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
